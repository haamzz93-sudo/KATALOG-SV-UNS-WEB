<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Batch Studio Marketplace Photo Generator (3 Lini Layanan & Zero-Crop)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    #log { font-family: monospace; font-size: 13px; max-height: 400px; overflow-y: auto; background: #1e293b; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Studio Generator Runner - Spesifik 3 Lini Layanan & Anti-Crop</h2>
  <div id="status">Memuat data produk...</div>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    function log(msg) {
      logEl.innerText += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    // Canvas Helpers
    const drawRoundRect = (ctx, x, y, w, h, r) => {
      if (typeof ctx.roundRect === "function") {
        ctx.roundRect(x, y, w, h, r);
      } else {
        const radius = typeof r === "number" ? r : (r[0] || 0);
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }
    };

    // FUNGSI UTAMA: Menghitung ukuran fit sempurna tanpa pernah keluar bounding box (Zero-Crop Guarantee)
    const calculateFit = (imgW, imgH, maxW, maxH) => {
      const imgRatio = imgW / imgH;
      const boxRatio = maxW / maxH;
      let w, h;
      if (imgRatio > boxRatio) {
        w = maxW;
        h = maxW / imgRatio;
      } else {
        h = maxH;
        w = maxH * imgRatio;
      }
      return { w: Math.round(w), h: Math.round(h) };
    };

    const drawContactShadow = (ctx, cx, cy, rx, ry, opacity = 0.35) => {
      ctx.save();
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
      grad.addColorStop(0, `rgba(15, 23, 42, ${opacity})`);
      grad.addColorStop(0.5, `rgba(15, 23, 42, ${opacity * 0.45})`);
      grad.addColorStop(1, "rgba(15, 23, 42, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    };

    // ==========================================
    // 1. FOTO UTAMA / HERO (ZERO-CROP BOUNDING BOX)
    // ==========================================
    const generateHeroPhoto = (img, item) => {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      const lini = item.metaLini || "produk";
      const isTech = lini === "teknologi";
      const isJasa = lini === "jasa";

      // 1. Backdrop Studio Khusus
      if (isTech) {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, 1280);
        bgGrad.addColorStop(0, "#F0F4F8");
        bgGrad.addColorStop(0.65, "#E1E8F0");
        bgGrad.addColorStop(1, "#D2DCE6");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 960, 1280);

        // Tech cyan spotlight
        const spot = ctx.createRadialGradient(480, 500, 50, 480, 500, 600);
        spot.addColorStop(0, "rgba(255, 255, 255, 0.98)");
        spot.addColorStop(0.6, "rgba(224, 242, 254, 0.4)");
        spot.addColorStop(1, "rgba(224, 242, 254, 0)");
        ctx.fillStyle = spot;
        ctx.fillRect(0, 0, 960, 1280);
      } else if (isJasa) {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, 1280);
        bgGrad.addColorStop(0, "#F8FAFC");
        bgGrad.addColorStop(0.65, "#EDF2F7");
        bgGrad.addColorStop(1, "#E2E8F0");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 960, 1280);

        // Warm gold spotlight
        const spot = ctx.createRadialGradient(480, 500, 50, 480, 500, 600);
        spot.addColorStop(0, "rgba(255, 255, 255, 0.98)");
        spot.addColorStop(0.6, "rgba(254, 249, 195, 0.25)");
        spot.addColorStop(1, "rgba(254, 249, 195, 0)");
        ctx.fillStyle = spot;
        ctx.fillRect(0, 0, 960, 1280);
      } else {
        // Produk Fisik Studio
        const bgGrad = ctx.createLinearGradient(0, 0, 0, 1280);
        bgGrad.addColorStop(0, "#F8FAFC");
        bgGrad.addColorStop(0.65, "#EDF2F7");
        bgGrad.addColorStop(1, "#E2E8F0");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 960, 1280);

        const spot = ctx.createRadialGradient(480, 500, 50, 480, 500, 600);
        spot.addColorStop(0, "rgba(255, 255, 255, 0.98)");
        spot.addColorStop(0.6, "rgba(255, 255, 255, 0.3)");
        spot.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = spot;
        ctx.fillRect(0, 0, 960, 1280);
      }

      // 2. Podium / Showcase Base
      const podX = 480, podY = 960, podRx = 400, podRy = 65, podH = 75;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(podX, podY + podH + 12, podRx + 20, podRy + 15, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.08)";
      ctx.fill();
      ctx.restore();

      const podBody = ctx.createLinearGradient(podX - podRx, 0, podX + podRx, 0);
      podBody.addColorStop(0, "#D9E2EC");
      podBody.addColorStop(0.3, "#F0F4F8");
      podBody.addColorStop(0.7, "#FFFFFF");
      podBody.addColorStop(1, "#CBD5E1");

      ctx.beginPath();
      ctx.moveTo(podX - podRx, podY);
      ctx.lineTo(podX - podRx, podY + podH);
      ctx.ellipse(podX, podY + podH, podRx, podRy, 0, 0, Math.PI, false);
      ctx.lineTo(podX + podRx, podY);
      ctx.ellipse(podX, podY, podRx, podRy, 0, 0, Math.PI, true);
      ctx.closePath();
      ctx.fillStyle = podBody;
      ctx.fill();

      const podTop = ctx.createLinearGradient(podX, podY - podRy, podX, podY + podRy);
      podTop.addColorStop(0, "#FFFFFF");
      podTop.addColorStop(1, "#F1F5F9");
      ctx.beginPath();
      ctx.ellipse(podX, podY, podRx, podRy, 0, 0, Math.PI * 2);
      ctx.fillStyle = podTop;
      ctx.fill();
      ctx.strokeStyle = "rgba(226, 232, 240, 0.9)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // 3. FIT BOUNDING BOX MAKSIMAL (ANTI-CROP)
      // Maksimum lebar 800px (aman di kanvas 960px), tinggi 650px
      const fit = calculateFit(img.width, img.height, 800, 650);
      const prodX = 480 - fit.w / 2;
      const prodY = podY - fit.h + 15;

      // Contact shadow proporsional dengan lebar aktual gambar
      drawContactShadow(ctx, 480, podY + 5, fit.w * 0.46, 20, 0.35);

      // Gambar produk utuh tanpa terpotong
      ctx.drawImage(img, prodX, prodY, fit.w, fit.h);

      // 4. Header Badges
      let headerTitle = "1. FOTO UTAMA • HERO MARKETPLACE";
      if (isTech) headerTitle = "1. TEKNOLOGI SIAP TERAP • DIGITAL PLATFORM";
      else if (isJasa) headerTitle = "1. JASA KONSULTAN & LAYANAN KEAHLIAN";
      else headerTitle = "1. PRODUK SIAP TERAP • HASIL RISET TERAPAN";

      ctx.fillStyle = isTech ? "rgba(14, 116, 144, 0.94)" : isJasa ? "rgba(15, 76, 129, 0.94)" : "rgba(197, 160, 89, 0.94)";
      ctx.beginPath();
      drawRoundRect(ctx, 40, 40, 450, 44, 22);
      ctx.fill();

      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 13px system-ui, sans-serif";
      ctx.fillText(headerTitle, 60, 67);

      // Kategori Tag Kanan Atas
      ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
      ctx.strokeStyle = "rgba(15, 76, 129, 0.4)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      drawRoundRect(ctx, 670, 40, 250, 44, 22);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#0F4C81";
      ctx.font = "bold 12px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(item.metaKategoriBadge || "SEKOLAH VOKASI UNS", 795, 67);
      ctx.textAlign = "left";

      // 5. Footer Spesifik
      ctx.fillStyle = "rgba(15, 23, 42, 0.6)";
      ctx.font = "12px system-ui, sans-serif";
      let footerText = "Standar Foto Komersial (3:4) • 100% Identitas, Karakter & Mutu Resmi Terjaga";
      if (isTech) footerText = "Platform Digital Teruji • Solusi Efisiensi & Transformasi Digital Mitra Industri / DUDI";
      else if (isJasa) footerText = "Layanan Konsultasi & Pengujian Terakreditasi • Dikelola Tenaga Ahli Profesional SV UNS";
      ctx.fillText(footerText, 45, 1240);

      return canvas.toDataURL("image/jpeg", 0.92);
    };

    // ==========================================
    // 2. FOTO DETAIL & KUALITAS (ANTI-CROP)
    // ==========================================
    const generateDetailPhoto = (img, item) => {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      const lini = item.metaLini || "produk";
      const isTech = lini === "teknologi";
      const isJasa = lini === "jasa";

      const bg = ctx.createLinearGradient(0, 0, 960, 1280);
      bg.addColorStop(0, "#F1F5F9");
      bg.addColorStop(0.5, "#E2E8F0");
      bg.addColorStop(1, "#CBD5E1");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 960, 1280);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(600, 0);
      ctx.lineTo(360, 1280);
      ctx.lineTo(0, 1280);
      ctx.closePath();
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.fill();
      ctx.restore();

      // Fit Bounding Box Tengah (max 760 x 680)
      const fit = calculateFit(img.width, img.height, 760, 680);
      const macroX = 480 - fit.w / 2;
      const macroY = 270;

      // Soft Depth Shadow
      ctx.save();
      ctx.translate(20, 12);
      ctx.globalAlpha = 0.18;
      ctx.filter = "blur(14px)";
      ctx.drawImage(img, macroX, macroY, fit.w, fit.h);
      ctx.restore();

      drawContactShadow(ctx, 480, macroY + fit.h + 10, fit.w * 0.48, 28, 0.35);

      // Gambar 3/4 Perspective halus
      ctx.save();
      ctx.translate(480, macroY + fit.h / 2);
      ctx.transform(0.97, 0, -0.03, 1, 0, 0);
      ctx.drawImage(img, -fit.w / 2, -fit.h / 2, fit.w, fit.h);
      ctx.restore();

      // Header Badge
      let detailHeader = "2. DETAIL KUALITAS & MATERIAL • PRESISI";
      if (isTech) detailHeader = "2. ARSITEKTUR SISTEM & INTERFACE • TEKNOLOGI";
      else if (isJasa) detailHeader = "2. STANDAR KOMPETENSI & LEGALITAS • ACCREDITED";

      ctx.fillStyle = isTech ? "rgba(14, 116, 144, 0.94)" : isJasa ? "rgba(15, 76, 129, 0.94)" : "rgba(15, 76, 129, 0.94)";
      ctx.beginPath();
      drawRoundRect(ctx, 40, 40, 480, 44, 22);
      ctx.fill();
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 13px system-ui, sans-serif";
      ctx.fillText(detailHeader, 58, 67);

      // Feature Callout Tags
      const tags = item.metaTags && item.metaTags.length > 0 ? item.metaTags.slice(0, 4) : [
        "Standar Mutu Teruji", "Finishing Rapi", "Keandalan Tinggi", "Siap Pakai DUDI"
      ];

      const badgePositions = [
        { x: 50, y: 130 },
        { x: 550, y: 130 },
        { x: 50, y: 1060 },
        { x: 550, y: 1060 },
      ];

      tags.forEach((tag, idx) => {
        const pos = badgePositions[idx] || { x: 50, y: 200 + idx * 80 };
        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
        ctx.strokeStyle = "rgba(197, 160, 89, 0.85)";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        drawRoundRect(ctx, pos.x, pos.y, 360, 52, 26);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "#10B981";
        ctx.beginPath();
        ctx.arc(pos.x + 28, pos.y + 26, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 13px system-ui, sans-serif";
        ctx.fillText("✓", pos.x + 23.5, pos.y + 31);

        ctx.fillStyle = "#0F172A";
        ctx.font = "bold 13px system-ui, sans-serif";
        ctx.fillText(tag, pos.x + 50, pos.y + 31);
      });

      ctx.fillStyle = "rgba(15, 23, 42, 0.6)";
      ctx.font = "12px system-ui, sans-serif";
      let footerText = "Sudut 3/4 Komersial • Menampilkan Sisi Samping, Kedalaman Fisik 3D & Kerapian Finishing";
      if (isTech) footerText = "Dirancang dengan Standar Rekayasa Perangkat Lunak Modern & Uji Fungsionalitas Ketat";
      else if (isJasa) footerText = "Dikelola Langsung oleh Tim Asesor, Instruktur & Peneliti Berkompeten Sekolah Vokasi UNS";
      ctx.fillText(footerText, 45, 1240);

      return canvas.toDataURL("image/jpeg", 0.92);
    };

    // ==========================================
    // 3. FOTO INFOGRAFIS (KATA-KATA KHUSUS 3 LINI)
    // ==========================================
    const generateBenefitPhoto = (img, item) => {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      const lini = item.metaLini || "produk";
      const isTech = lini === "teknologi";
      const isJasa = lini === "jasa";

      const bg = ctx.createLinearGradient(0, 0, 960, 1280);
      bg.addColorStop(0, "#FFFFFF");
      bg.addColorStop(0.5, "#F8FAFC");
      bg.addColorStop(1, "#EDF2F7");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 960, 1280);

      // Stripe Accent
      ctx.fillStyle = isTech ? "#0E7490" : isJasa ? "#0F4C81" : "#C5A059";
      ctx.fillRect(0, 0, 10, 1280);

      // Top Tagline
      ctx.fillStyle = "#C5A059";
      ctx.font = "bold 13px system-ui, sans-serif";
      let topCategory = "INFOGRAFIS HILIRISASI PRODUK SIAP TERAP VOKASI UNS";
      if (isTech) topCategory = "INFOGRAFIS TRANSFORMASI DIGITAL & TEKNOLOGI VOKASI UNS";
      else if (isJasa) topCategory = "INFOGRAFIS JASA KONSULTAN & PENGUJIAN LABORATORIUM";
      ctx.fillText(topCategory, 50, 56);

      // Main Headline
      ctx.fillStyle = "#0F172A";
      ctx.font = "bold 26px system-ui, sans-serif";
      ctx.fillText(item.metaHeadline || "KENAPA PRODUK INI LAYAK DIPILIH?", 50, 96);

      // Subtitle
      ctx.fillStyle = "#64748B";
      ctx.font = "14px system-ui, sans-serif";
      let subtitle = "3 Alasan Utama Mengapa Inovasi Ini Memiliki Nilai Jual & Mutu Unggul:";
      if (isTech) subtitle = "3 Nilai Tambah Transformasi Digital Bersama Sekolah Vokasi UNS:";
      else if (isJasa) subtitle = "3 Jaminan Mutu Profesional Tenaga Ahli dan Laboratorium SV UNS:";
      ctx.fillText(subtitle, 50, 126);

      // Product Showcase Frame (Fit max 780 x 440)
      const fit = calculateFit(img.width, img.height, 780, 440);
      const prodX = 480 - fit.w / 2;
      const prodY = 175;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(480, 620, Math.min(320, fit.w * 0.55), 36, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 76, 129, 0.08)";
      ctx.fill();
      ctx.strokeStyle = "rgba(197, 160, 89, 0.5)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      drawContactShadow(ctx, 480, 615, fit.w * 0.44, 20, 0.35);
      ctx.drawImage(img, prodX, prodY, fit.w, fit.h);

      // 3 Kartu Keunggulan Spesifik per Lini
      let features = [];
      if (isTech) {
        features = [
          {
            title: "Otomasi Alur Kerja & Akurasi Data Tinggi",
            desc: "Memangkas proses manual hingga 80% dengan integrasi pemrosesan data real-time yang presisi.",
            badge: "01",
            color: "#0E7490",
          },
          {
            title: "Arsitektur Cloud Andal & Keamanan Terjamin",
            desc: "Sistem dirancang modular, stabil, dan siap disesuaikan langsung dengan infrastruktur mitra DUDI.",
            badge: "02",
            color: "#0F4C81",
          },
          {
            title: "Pendampingan Implementasi & Alih Teknologi",
            desc: "Didukung penuh dosen dan talenta vokasi hingga sistem beroperasi mandiri dan optimal.",
            badge: "03",
            color: "#10B981",
          },
        ];
      } else if (isJasa) {
        features = [
          {
            title: "Didukung Tenaga Ahli Bersertifikasi Resmi",
            desc: "Instruktur, konsultan, dan teknisi berkualifikasi tinggi dengan portofolio proyek industri nyata.",
            badge: "01",
            color: "#0F4C81",
          },
          {
            title: "Fasilitas Laboratorium & Instrumen Mutakhir",
            desc: "Peralatan uji presisi terkalibrasi berstandar nasional dan global (ASME, ASTM, ISO, Glodon).",
            badge: "02",
            color: "#C5A059",
          },
          {
            title: "Output Laporan Resmi & Sertifikat Sah Diakui",
            desc: "Dokumen hasil uji, sertifikat kompetensi, dan kerja sama legal yang kredibel bagi mitra.",
            badge: "03",
            color: "#10B981",
          },
        ];
      } else {
        features = [
          {
            title: "Mutu & Formulasi Teruji Laboratorium",
            desc: "Hasil riset terapan sivitas akademika SV UNS yang melewati serangkaian uji kelayakan ketat.",
            badge: "01",
            color: "#0F4C81",
          },
          {
            title: "Kualitas Presisi & Siap Pasar Komersial",
            desc: "Kontrol kualitas berstandar industri dengan kemasan/struktur kokoh dan siap didistribusikan.",
            badge: "02",
            color: "#C5A059",
          },
          {
            title: "Efisiensi Biaya & Daya Guna Maksimal",
            desc: "Menjawab kebutuhan mitra industri dan konsumen dengan nilai ekonomis kompetitif serta tahan lama.",
            badge: "03",
            color: "#10B981",
          },
        ];
      }

      features.forEach((feat, i) => {
        const cardY = 670 + i * 165;
        ctx.save();
        ctx.fillStyle = "#FFFFFF";
        ctx.strokeStyle = "rgba(226, 232, 240, 0.9)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        drawRoundRect(ctx, 50, cardY, 860, 140, 20);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = feat.color + "18";
        ctx.beginPath();
        ctx.arc(105, cardY + 50, 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = feat.color;
        ctx.font = "bold 18px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(feat.badge, 105, cardY + 57);
        ctx.textAlign = "left";

        ctx.fillStyle = "#0F172A";
        ctx.font = "bold 16px system-ui, sans-serif";
        ctx.fillText(feat.title, 155, cardY + 48);

        ctx.fillStyle = "#475569";
        ctx.font = "14px system-ui, sans-serif";
        const words = feat.desc.split(" ");
        let line1 = "", line2 = "";
        for (const w of words) {
          if ((line1 + w).length < 65) line1 += w + " ";
          else line2 += w + " ";
        }
        ctx.fillText(line1.trim(), 155, cardY + 78);
        if (line2) ctx.fillText(line2.trim(), 155, cardY + 102);
      });

      ctx.fillStyle = "rgba(15, 23, 42, 0.55)";
      ctx.font = "12px system-ui, sans-serif";
      let footerNote = "Standar Infografis Edukatif & Promotif • Membantu Mitra DUDI Memahami Nilai Tambah Inovasi";
      ctx.fillText(footerNote, 50, 1240);

      return canvas.toDataURL("image/jpeg", 0.92);
    };

    // ==========================================
    // 4. FOTO LIFESTYLE / CONTEXT (SPESIFIK 3 LINI)
    // ==========================================
    const generateLifestylePhoto = (img, item) => {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      const lini = item.metaLini || "produk";
      const isTech = lini === "teknologi";
      const isJasa = lini === "jasa";

      if (isTech) {
        // Workspace Tech / Control Room Modern
        const wallGrad = ctx.createLinearGradient(0, 0, 0, 700);
        wallGrad.addColorStop(0, "#0F172A");
        wallGrad.addColorStop(0.5, "#1E293B");
        wallGrad.addColorStop(1, "#334155");
        ctx.fillStyle = wallGrad;
        ctx.fillRect(0, 0, 960, 700);

        // Tech cyan ambient glow
        const glow = ctx.createRadialGradient(480, 400, 20, 480, 400, 500);
        glow.addColorStop(0, "rgba(56, 189, 248, 0.25)");
        glow.addColorStop(1, "rgba(56, 189, 248, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 960, 700);

        // Tech desk
        const desk = ctx.createLinearGradient(0, 700, 0, 1280);
        desk.addColorStop(0, "#1E293B");
        desk.addColorStop(0.5, "#0F172A");
        desk.addColorStop(1, "#020617");
        ctx.fillStyle = desk;
        ctx.fillRect(0, 700, 960, 580);
      } else if (isJasa) {
        // Ruang Konsultasi / Laboratorium Eksekutif
        const wallGrad = ctx.createLinearGradient(0, 0, 0, 700);
        wallGrad.addColorStop(0, "#E2E8F0");
        wallGrad.addColorStop(0.5, "#CBD5E1");
        wallGrad.addColorStop(1, "#94A3B8");
        ctx.fillStyle = wallGrad;
        ctx.fillRect(0, 0, 960, 700);

        // Executive desk surface
        const desk = ctx.createLinearGradient(0, 700, 0, 1280);
        desk.addColorStop(0, "#334155");
        desk.addColorStop(0.5, "#1E293B");
        desk.addColorStop(1, "#0F172A");
        ctx.fillStyle = desk;
        ctx.fillRect(0, 700, 960, 580);
      } else {
        // Meja Kayu Hangat untuk Produk Fisik / Pangan / Herbal
        const wallGrad = ctx.createLinearGradient(0, 0, 0, 700);
        wallGrad.addColorStop(0, "#F1ECE6");
        wallGrad.addColorStop(0.5, "#E8DFD5");
        wallGrad.addColorStop(1, "#D6C8B8");
        ctx.fillStyle = wallGrad;
        ctx.fillRect(0, 0, 960, 700);

        // Wood table
        const woodGrad = ctx.createLinearGradient(0, 700, 0, 1280);
        woodGrad.addColorStop(0, "#C79C6F");
        woodGrad.addColorStop(0.4, "#B58455");
        woodGrad.addColorStop(1, "#8A582F");
        ctx.fillStyle = woodGrad;
        ctx.fillRect(0, 700, 960, 580);

        ctx.strokeStyle = "rgba(110, 65, 30, 0.18)";
        ctx.lineWidth = 1.5;
        for (let y = 745; y < 1280; y += 50) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(960, y);
          ctx.stroke();
        }
      }

      // Edge shadow
      const edgeShadow = ctx.createLinearGradient(0, 700, 0, 725);
      edgeShadow.addColorStop(0, "rgba(0, 0, 0, 0.25)");
      edgeShadow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = edgeShadow;
      ctx.fillRect(0, 700, 960, 25);

      // Fit Bounding Box Tabletop (max 780 x 600)
      const fit = calculateFit(img.width, img.height, 780, 600);
      const prodX = 480 - fit.w / 2;
      const prodY = 720 - fit.h + 20;

      drawContactShadow(ctx, 480, 725, fit.w * 0.46, 24, 0.45);

      // Soft reflection
      ctx.save();
      ctx.translate(480, 720);
      ctx.scale(1, -0.28);
      ctx.translate(-480, -720);
      ctx.globalAlpha = 0.12;
      ctx.drawImage(img, prodX, prodY, fit.w, fit.h);
      ctx.restore();

      // Main image
      ctx.drawImage(img, prodX, prodY, fit.w, fit.h);

      // Header Badge
      let contextTitle = "4. KONTEKS PENGGUNAAN RIIL • REAL CONTEXT";
      if (isTech) contextTitle = "4. WORKSPACE DIGITAL • CONTROL & MONITORING";
      else if (isJasa) contextTitle = "4. FASILITAS LABORATORIUM & RUANG KONSULTASI";

      ctx.fillStyle = isTech ? "rgba(14, 116, 144, 0.94)" : isJasa ? "rgba(15, 76, 129, 0.94)" : "rgba(15, 76, 129, 0.9)";
      ctx.beginPath();
      drawRoundRect(ctx, 40, 40, 460, 42, 21);
      ctx.fill();
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 13px system-ui, sans-serif";
      ctx.fillText(contextTitle, 58, 66);

      ctx.fillStyle = isTech ? "rgba(224, 242, 254, 0.9)" : "rgba(255, 255, 255, 0.9)";
      ctx.font = "12px system-ui, sans-serif";
      let footerNote = "Display Penggunaan Nyata (3:4) • Representasi Lingkungan Implementasi Lapangan Mitra Industri";
      ctx.fillText(footerNote, 45, 1240);

      return canvas.toDataURL("image/jpeg", 0.92);
    };

    const loadImageAsync = (src) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = (e) => reject(new Error("Gagal load gambar: " + src));
        img.src = src;
      });
    };

    // MAIN BATCH PROCESS
    async function runBatch() {
      try {
        log("Mengambil daftar 31 produk dari server...");
        const res = await fetch("/api/products");
        const products = await res.json();
        log(`Berhasil memuat ${products.length} produk.`);

        for (let i = 0; i < products.length; i++) {
          const p = products[i];
          statusEl.innerText = `Memproses (${i + 1}/${products.length}): ${p.nama_item}`;
          log(`\n[${i + 1}/${products.length}] [${p.metaLini.toUpperCase()}] Memproses: ${p.slug}...`);

          try {
            // Load gambar mentah asli 100% resolusi penuh
            const rawUrl = p.rawImageUrl || p.thumbnail_url;
            const rawImg = await loadImageAsync(rawUrl);

            // Generate 4 Photos dengan Zero-Crop Fit & Kata-Kata Khusus 3 Lini
            const heroDataUrl = generateHeroPhoto(rawImg, p);
            const detailDataUrl = generateDetailPhoto(rawImg, p);
            const benefitDataUrl = generateBenefitPhoto(rawImg, p);
            const lifestyleDataUrl = generateLifestylePhoto(rawImg, p);

            // Simpan Foto 1: Hero
            await fetch("/api/save-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ slug: p.slug, photoIndex: 1, photoId: "hero", dataUrl: heroDataUrl })
            });

            // Simpan Foto 2: Detail
            await fetch("/api/save-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ slug: p.slug, photoIndex: 2, photoId: "detail", dataUrl: detailDataUrl })
            });

            // Simpan Foto 3: Infografis
            await fetch("/api/save-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ slug: p.slug, photoIndex: 3, photoId: "infografis", dataUrl: benefitDataUrl })
            });

            // Simpan Foto 4: Lifestyle
            await fetch("/api/save-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ slug: p.slug, photoIndex: 4, photoId: "lifestyle", dataUrl: lifestyleDataUrl })
            });

            log(`-> Sukses generate 4 foto studio (${p.metaLini}) untuk ${p.slug}`);
          } catch (err) {
            log(`[ERROR] Gagal memproses ${p.slug}: ${err.message}`);
          }
        }

        log("\nSemua 31 produk selesai diproses! Mengirim konfirmasi penyelesaian...");
        statusEl.innerText = "Selesai! Menyimpan update katalog...";
        await fetch("/api/done", { method: "POST" });
        statusEl.innerText = "Semua 124 Foto Studio berhasil tersimpan ke sistem!";
      } catch (err) {
        log(`[FATAL] Error running batch: ${err.message}`);
        statusEl.innerText = "Error: " + err.message;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      runBatch();
    });
  </script>
