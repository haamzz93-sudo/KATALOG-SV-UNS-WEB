<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Batch Studio Marketplace Photo Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    #log { font-family: monospace; font-size: 13px; max-height: 400px; overflow-y: auto; background: #1e293b; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Studio Generator Runner - 31 Produk Resmi SV UNS</h2>
  <div id="status">Memuat data produk...</div>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    function log(msg) {
      logEl.innerText += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    // Helper Canvas
    const drawRoundRect = (ctx, x, y, w, h, r) => {
      if (typeof ctx.roundRect === "function") {
        ctx.roundRect(x, y, w, h, r);
      } else {
        const radius = typeof r === "number" ? r : (r[0] || 0);
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }
    };

    const trimTransparentBorders = (canvas) => {
      const ctx = canvas.getContext("2d");
      if (!ctx) return canvas;
      const w = canvas.width;
      const h = canvas.height;
      try {
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        let minX = w, minY = h, maxX = 0, maxY = 0;
        let found = false;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const alpha = data[(y * w + x) * 4 + 3];
            if (alpha > 15) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
              found = true;
            }
          }
        }

        if (!found) return canvas;

        const pad = 12;
        minX = Math.max(0, minX - pad);
        minY = Math.max(0, minY - pad);
        maxX = Math.min(w, maxX + pad);
        maxY = Math.min(h, maxY + pad);

        const cropW = maxX - minX;
        const cropH = maxY - minY;
        if (cropW <= 0 || cropH <= 0) return canvas;

        const cropped = document.createElement("canvas");
        cropped.width = cropW;
        cropped.height = cropH;
        const cCtx = cropped.getContext("2d");
        if (cCtx) {
          cCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
          return cropped;
        }
      } catch (e) {
        console.warn("Trim transparent error:", e);
      }
      return canvas;
    };

    const isolateProductForeground = (sourceImg, tolerance = 36) => {
      const canvas = document.createElement("canvas");
      const w = sourceImg.width;
      const h = sourceImg.height;
      canvas.width = w;
      canvas.height = h;

      const ctx = canvas.getContext("2d");
      if (!ctx) return sourceImg;

      ctx.drawImage(sourceImg, 0, 0);

      try {
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        const sampleCorner = (px, py) => {
          const idx = (py * w + px) * 4;
          return [data[idx], data[idx + 1], data[idx + 2]];
        };

        const corners = [
          sampleCorner(2, 2),
          sampleCorner(w - 3, 2),
          sampleCorner(2, h - 3),
          sampleCorner(w - 3, h - 3),
          sampleCorner(Math.floor(w / 2), 2),
        ];

        const avgBgR = corners.reduce((acc, c) => acc + c[0], 0) / corners.length;
        const avgBgG = corners.reduce((acc, c) => acc + c[1], 0) / corners.length;
        const avgBgB = corners.reduce((acc, c) => acc + c[2], 0) / corners.length;

        const brightness = (avgBgR + avgBgG + avgBgB) / 3;
        if (brightness < 105) {
          return trimTransparentBorders(canvas);
        }

        const totalPixels = w * h;
        const visited = new Uint8Array(totalPixels);
        const queue = new Int32Array(totalPixels);
        let head = 0;
        let tail = 0;

        const isBackground = (r, g, b) => {
          const dr = r - avgBgR;
          const dg = g - avgBgG;
          const db = b - avgBgB;
          return Math.sqrt(dr * dr + dg * dg + db * db) <= tolerance;
        };

        const enqueue = (px, py) => {
          const pIdx = py * w + px;
          if (visited[pIdx]) return;
          const dIdx = pIdx * 4;
          if (isBackground(data[dIdx], data[dIdx + 1], data[dIdx + 2])) {
            visited[pIdx] = 1;
            queue[tail++] = pIdx;
          }
        };

        for (let x = 0; x < w; x++) {
          enqueue(x, 0);
          enqueue(x, h - 1);
        }
        for (let y = 0; y < h; y++) {
          enqueue(0, y);
          enqueue(w - 1, y);
        }

        while (head < tail) {
          const curr = queue[head++];
          const cx = curr % w;
          const cy = Math.floor(curr / w);

          if (cx > 0) enqueue(cx - 1, cy);
          if (cx < w - 1) enqueue(cx + 1, cy);
          if (cy > 0) enqueue(cx, cy - 1);
          if (cy < h - 1) enqueue(cx, cy + 1);
        }

        for (let i = 0; i < totalPixels; i++) {
          if (visited[i]) {
            data[i * 4 + 3] = 0;
          }
        }

        ctx.putImageData(imgData, 0, 0);
      } catch (err) {
        console.warn("Isolasi fallback:", err);
      }

      return trimTransparentBorders(canvas);
    };

    const drawContactShadow = (ctx, cx, cy, rx, ry, opacity = 0.36) => {
      ctx.save();
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
      grad.addColorStop(0, `rgba(15, 23, 42, ${opacity})`);
      grad.addColorStop(0.5, `rgba(15, 23, 42, ${opacity * 0.45})`);
      grad.addColorStop(1, "rgba(15, 23, 42, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    };

    // 1. HERO PHOTO
    const generateHeroPhoto = (img, namaItem, kategori) => {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      // Backdrop
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 1280);
      bgGrad.addColorStop(0, "#F8FAFC");
      bgGrad.addColorStop(0.65, "#EDF2F7");
      bgGrad.addColorStop(1, "#E2E8F0");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 960, 1280);

      // Spotlight
      const spotGrad = ctx.createRadialGradient(480, 520, 60, 480, 520, 620);
      spotGrad.addColorStop(0, "rgba(255, 255, 255, 0.96)");
      spotGrad.addColorStop(0.7, "rgba(255, 255, 255, 0.35)");
      spotGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
      ctx.fillStyle = spotGrad;
      ctx.fillRect(0, 0, 960, 1280);

      // Podium 3D Pedestal
      const podX = 480, podY = 960, podRx = 380, podRy = 65, podH = 80;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(podX, podY + podH + 12, podRx + 25, podRy + 15, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.08)";
      ctx.fill();
      ctx.restore();

      const podBodyGrad = ctx.createLinearGradient(podX - podRx, 0, podX + podRx, 0);
      podBodyGrad.addColorStop(0, "#D9E2EC");
      podBodyGrad.addColorStop(0.3, "#F0F4F8");
      podBodyGrad.addColorStop(0.7, "#FFFFFF");
      podBodyGrad.addColorStop(1, "#CBD5E1");

      ctx.beginPath();
      ctx.moveTo(podX - podRx, podY);
      ctx.lineTo(podX - podRx, podY + podH);
      ctx.ellipse(podX, podY + podH, podRx, podRy, 0, 0, Math.PI, false);
      ctx.lineTo(podX + podRx, podY);
      ctx.ellipse(podX, podY, podRx, podRy, 0, 0, Math.PI, true);
      ctx.closePath();
      ctx.fillStyle = podBodyGrad;
      ctx.fill();

      const podTopGrad = ctx.createLinearGradient(podX, podY - podRy, podX, podY + podRy);
      podTopGrad.addColorStop(0, "#FFFFFF");
      podTopGrad.addColorStop(1, "#F1F5F9");
      ctx.beginPath();
      ctx.ellipse(podX, podY, podRx, podRy, 0, 0, Math.PI * 2);
      ctx.fillStyle = podTopGrad;
      ctx.fill();
      ctx.strokeStyle = "rgba(226, 232, 240, 0.85)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Product
      const prodTargetH = 740;
      const prodRatio = img.width / img.height;
      const prodW = prodTargetH * prodRatio;
      const prodX = 480 - prodW / 2;
      const prodY = podY - prodTargetH + 18;

      drawContactShadow(ctx, 480, podY + 5, prodW * 0.46, 22, 0.38);
      ctx.drawImage(img, prodX, prodY, prodW, prodTargetH);

      // Badges
      ctx.fillStyle = "rgba(15, 76, 129, 0.92)";
      ctx.beginPath();
      drawRoundRect(ctx, 40, 40, 360, 42, 21);
      ctx.fill();

      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 14px system-ui, sans-serif";
      ctx.fillText("1. FOTO UTAMA • HERO MARKETPLACE", 60, 66);

      if (kategori) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
        ctx.strokeStyle = "rgba(197, 160, 89, 0.7)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        drawRoundRect(ctx, 680, 40, 240, 42, 21);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#0F4C81";
        ctx.font = "bold 13px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(kategori, 800, 66);
        ctx.textAlign = "left";
      }

      ctx.fillStyle = "rgba(15, 23, 42, 0.55)";
      ctx.font = "12px system-ui, sans-serif";
      ctx.fillText("Standar Foto Marketplace Komersial (3:4) • 100% Keaslian Identitas & Warna Terjaga", 45, 1240);

      return canvas.toDataURL("image/jpeg", 0.92);
    };

    // 2. DETAIL PHOTO
    const generateDetailPhoto = (img, detailTags) => {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      // BG
      const bg = ctx.createLinearGradient(0, 0, 960, 1280);
      bg.addColorStop(0, "#F1F5F9");
      bg.addColorStop(0.5, "#E2E8F0");
      bg.addColorStop(1, "#CBD5E1");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 960, 1280);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(600, 0);
      ctx.lineTo(360, 1280);
      ctx.lineTo(0, 1280);
      ctx.closePath();
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.fill();
      ctx.restore();

      // Product 3/4 perspective
      const macroH = 820;
      const macroW = (macroH * img.width) / img.height;
      const macroX = 480 - macroW / 2;
      const macroY = 220;

      ctx.save();
      ctx.save();
      ctx.translate(28, 14);
      ctx.globalAlpha = 0.22;
      ctx.filter = "blur(12px)";
      ctx.drawImage(img, macroX, macroY, macroW, macroH);
      ctx.restore();

      drawContactShadow(ctx, 490, macroY + macroH + 10, macroW * 0.52, 38, 0.35);

      ctx.save();
      ctx.translate(480, macroY + macroH / 2);
      ctx.transform(0.96, 0, -0.04, 1, 0, 0);
      ctx.drawImage(img, -macroW / 2, -macroH / 2, macroW, macroH);
      ctx.restore();
      ctx.restore();

      // Header
      ctx.fillStyle = "rgba(15, 76, 129, 0.94)";
      ctx.beginPath();
      drawRoundRect(ctx, 40, 40, 460, 44, 22);
      ctx.fill();
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 14px system-ui, sans-serif";
      ctx.fillText("2. SISI SAMPING & DETAIL KUALITAS • 3/4 PERSPECTIVE", 58, 67);

      const defaultSideTags = ["Sisi Samping Produk", "Ketebalan Presisi", "Detail Material", "Finishing Rapi"];
      const tags = detailTags && detailTags.length > 0
        ? ["Sisi Samping Produk", ...detailTags.slice(0, 3)]
        : defaultSideTags;

      const badgePositions = [
        { x: 50, y: 130 },
        { x: 560, y: 130 },
        { x: 50, y: 1060 },
        { x: 560, y: 1060 },
      ];

      tags.forEach((tag, idx) => {
        const pos = badgePositions[idx] || { x: 50, y: 200 + idx * 80 };
        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
        ctx.strokeStyle = "rgba(197, 160, 89, 0.85)";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        drawRoundRect(ctx, pos.x, pos.y, 350, 52, 26);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "#10B981";
        ctx.beginPath();
        ctx.arc(pos.x + 28, pos.y + 26, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 13px system-ui, sans-serif";
        ctx.fillText("✓", pos.x + 23.5, pos.y + 31);

        ctx.fillStyle = "#0F172A";
        ctx.font = "bold 14px system-ui, sans-serif";
        ctx.fillText(tag, pos.x + 50, pos.y + 31);
      });

      ctx.fillStyle = "rgba(15, 23, 42, 0.6)";
      ctx.font = "12px system-ui, sans-serif";
      ctx.fillText("Sudut 3/4 Komersial • Menampilkan Sisi Samping, Ketebalan 3D & Kualitas Finishing Asli", 45, 1240);

      return canvas.toDataURL("image/jpeg", 0.92);
    };

    // 3. BENEFIT PHOTO (INFOGRAFIS)
    const generateBenefitPhoto = (img, headline, namaItem, kategori) => {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      const bg = ctx.createLinearGradient(0, 0, 960, 1280);
      bg.addColorStop(0, "#FFFFFF");
      bg.addColorStop(0.5, "#F8FAFC");
      bg.addColorStop(1, "#EDF2F7");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 960, 1280);

      ctx.fillStyle = "#0F4C81";
      ctx.fillRect(0, 0, 10, 1280);

      ctx.fillStyle = "#C5A059";
      ctx.font = "bold 13px system-ui, sans-serif";
      ctx.fillText("INFOGRAFIS HILIRISASI PRODUK INOVASI VOKASI UNS", 50, 56);

      const mainHeadline = headline || "KENAPA PRODUK INI LAYAK DIPILIH?";
      ctx.fillStyle = "#0F172A";
      ctx.font = "bold 28px system-ui, sans-serif";
      ctx.fillText(mainHeadline, 50, 96);

      ctx.fillStyle = "#64748B";
      ctx.font = "14px system-ui, sans-serif";
      ctx.fillText("3 Alasan Utama Mengapa Produk Inovasi Ini Memiliki Nilai Jual & Mutu Tinggi:", 50, 126);

      // Product Showcase Frame
      const prodH = 460;
      const prodW = (prodH * img.width) / img.height;
      const prodX = 480 - prodW / 2;
      const prodY = 160;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(480, 620, 280, 40, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 76, 129, 0.08)";
      ctx.fill();
      ctx.strokeStyle = "rgba(197, 160, 89, 0.5)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      drawContactShadow(ctx, 480, 615, prodW * 0.44, 20, 0.35);
      ctx.drawImage(img, prodX, prodY, prodW, prodH);

      // 3 Keunggulan Cards
      const features = [
        {
          title: "Kualitas & Formula Terverifikasi Lab",
          desc: "Diriset & dikembangkan langsung oleh sivitas akademika Sekolah Vokasi UNS dengan uji mutu ketat.",
          badge: "01",
          color: "#0F4C81",
        },
        {
          title: "Kemasan Rapi, Higienis & Siap Pasar",
          desc: "Standar packaging komersial modern, melindungi kualitas produk, serta siap bersaing di marketplace.",
          badge: "02",
          color: "#C5A059",
        },
        {
          title: "Solutif & Siap Kolaborasi Industri",
          desc: "Menjawab kebutuhan mitra DUDI dan konsumen dengan efisiensi biaya dan daya guna maksimal.",
          badge: "03",
          color: "#10B981",
        },
      ];

      features.forEach((feat, i) => {
        const cardY = 670 + i * 165;
        ctx.save();
        ctx.fillStyle = "#FFFFFF";
        ctx.strokeStyle = "rgba(226, 232, 240, 0.9)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        drawRoundRect(ctx, 50, cardY, 860, 140, 20);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = feat.color + "18";
        ctx.beginPath();
        ctx.arc(105, cardY + 50, 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = feat.color;
        ctx.font = "bold 18px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(feat.badge, 105, cardY + 57);
        ctx.textAlign = "left";

        ctx.fillStyle = "#0F172A";
        ctx.font = "bold 17px system-ui, sans-serif";
        ctx.fillText(feat.title, 155, cardY + 48);

        ctx.fillStyle = "#475569";
        ctx.font = "14px system-ui, sans-serif";
        const words = feat.desc.split(" ");
        let line1 = "", line2 = "";
        for (const w of words) {
          if ((line1 + w).length < 65) line1 += w + " ";
          else line2 += w + " ";
        }
        ctx.fillText(line1.trim(), 155, cardY + 78);
        if (line2) ctx.fillText(line2.trim(), 155, cardY + 102);
      });

      ctx.fillStyle = "rgba(15, 23, 42, 0.55)";
      ctx.font = "12px system-ui, sans-serif";
      ctx.fillText("Standar Infografis Edukatif & Promotif • Membantu Calon Pembeli Memahami Manfaat Utama Produk", 50, 1240);

      return canvas.toDataURL("image/jpeg", 0.92);
    };

    // 4. LIFESTYLE PHOTO
    const generateLifestylePhoto = (img, kategori) => {
      const canvas = document.createElement("canvas");
      canvas.width = 960;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      // Wall
      const wallGrad = ctx.createLinearGradient(0, 0, 0, 700);
      wallGrad.addColorStop(0, "#F1ECE6");
      wallGrad.addColorStop(0.5, "#E8DFD5");
      wallGrad.addColorStop(1, "#D6C8B8");
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, 960, 700);

      // Sunlight
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(500, 0);
      ctx.lineTo(720, 700);
      ctx.lineTo(180, 700);
      ctx.closePath();
      const sunGrad = ctx.createLinearGradient(200, 0, 450, 700);
      sunGrad.addColorStop(0, "rgba(255, 250, 240, 0.45)");
      sunGrad.addColorStop(1, "rgba(255, 250, 240, 0.05)");
      ctx.fillStyle = sunGrad;
      ctx.fill();
      ctx.restore();

      // Wood table
      const woodGrad = ctx.createLinearGradient(0, 700, 0, 1280);
      woodGrad.addColorStop(0, "#C79C6F");
      woodGrad.addColorStop(0.4, "#B58455");
      woodGrad.addColorStop(1, "#8A582F");
      ctx.fillStyle = woodGrad;
      ctx.fillRect(0, 700, 960, 580);

      ctx.strokeStyle = "rgba(110, 65, 30, 0.18)";
      ctx.lineWidth = 1.5;
      for (let y = 745; y < 1280; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(960, y);
        ctx.stroke();
      }

      const edgeShadow = ctx.createLinearGradient(0, 700, 0, 725);
      edgeShadow.addColorStop(0, "rgba(0, 0, 0, 0.18)");
      edgeShadow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = edgeShadow;
      ctx.fillRect(0, 700, 960, 25);

      // Product placement
      const prodH = 680;
      const prodRatio = img.width / img.height;
      const prodW = prodH * prodRatio;
      const prodX = 480 - prodW / 2;
      const prodY = 720 - prodH + 20;

      drawContactShadow(ctx, 480, 725, prodW * 0.46, 24, 0.45);

      ctx.save();
      ctx.translate(480, 720);
      ctx.scale(1, -0.32);
      ctx.translate(-480, -720);
      ctx.globalAlpha = 0.14;
      ctx.drawImage(img, prodX, prodY, prodW, prodH);
      ctx.restore();

      ctx.drawImage(img, prodX, prodY, prodW, prodH);

      ctx.fillStyle = "rgba(15, 76, 129, 0.9)";
      ctx.beginPath();
      drawRoundRect(ctx, 40, 40, 390, 42, 21);
      ctx.fill();
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 14px system-ui, sans-serif";
      ctx.fillText("4. KONTEKS LIFESTYLE • REAL USE DISPLAY", 58, 66);

      ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
      ctx.font = "12px system-ui, sans-serif";
      ctx.fillText("Display Meja Komersial Estetik (3:4) • Menampilkan Kesan Produk Digunakan dalam Kehidupan Nyata", 45, 1240);

      return canvas.toDataURL("image/jpeg", 0.92);
    };

    // Load Image Promise
    const loadImageAsync = (src) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = (e) => reject(new Error("Gagal load gambar: " + src));
        img.src = src;
      });
    };

    // MAIN BATCH PROCESS
    async function runBatch() {
      try {
        log("Mengambil daftar 31 produk dari server...");
        const res = await fetch("/api/products");
        const products = await res.json();
        log(`Berhasil memuat ${products.length} produk.`);

        for (let i = 0; i < products.length; i++) {
          const p = products[i];
          statusEl.innerText = `Memproses (${i + 1}/${products.length}): ${p.nama_item}`;
          log(`\n[${i + 1}/${products.length}] Memproses: ${p.slug}...`);

          try {
            // Load gambar mentah
            const rawImg = await loadImageAsync(p.thumbnail_url);
            const isolated = isolateProductForeground(rawImg);

            // Generate 4 Photos
            const heroDataUrl = generateHeroPhoto(isolated, p.nama_item, p.metaKategori);
            const detailDataUrl = generateDetailPhoto(isolated, p.metaTags);
            const benefitDataUrl = generateBenefitPhoto(isolated, p.metaHeadline, p.nama_item, p.metaKategori);
            const lifestyleDataUrl = generateLifestylePhoto(isolated, p.metaKategori);

            // Simpan Foto 1: Hero
            await fetch("/api/save-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ slug: p.slug, photoIndex: 1, photoId: "hero", dataUrl: heroDataUrl })
            });

            // Simpan Foto 2: Detail
            await fetch("/api/save-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ slug: p.slug, photoIndex: 2, photoId: "detail", dataUrl: detailDataUrl })
            });

            // Simpan Foto 3: Infografis
            await fetch("/api/save-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ slug: p.slug, photoIndex: 3, photoId: "infografis", dataUrl: benefitDataUrl })
            });

            // Simpan Foto 4: Lifestyle
            await fetch("/api/save-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ slug: p.slug, photoIndex: 4, photoId: "lifestyle", dataUrl: lifestyleDataUrl })
            });

            log(`-> Sukses generate 4 foto studio portrait 3:4 untuk ${p.slug}`);
          } catch (err) {
            log(`[ERROR] Gagal memproses ${p.slug}: ${err.message}`);
          }
        }

        log("\nSemua 31 produk selesai diproses! Mengirim konfirmasi penyelesaian...");
        statusEl.innerText = "Selesai! Menyimpan update katalog...";
        await fetch("/api/done", { method: "POST" });
        statusEl.innerText = "Semua 124 Foto Studio berhasil tersimpan ke sistem!";
      } catch (err) {
        log(`[FATAL] Error running batch: ${err.message}`);
        statusEl.innerText = "Error: " + err.message;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      runBatch();
    });
  </script>
</body>
